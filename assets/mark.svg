<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Skewed Glass Row: three translucent panes, current space taller.
       Overlaps are true opacity blends; the mark deepens on dark grounds
       and lightens on light grounds by design. -->
  <g transform="translate(2.2 0) skewX(-8)">
    <rect x="3.2" y="6" width="6.4" height="12" rx="1.2" fill="#22D3EE" opacity="0.78"/>
    <rect x="8.2" y="4.5" width="6.4" height="15" rx="1.2" fill="#3B82F6" opacity="0.85"/>
    <rect x="13.2" y="6" width="6.4" height="12" rx="1.2" fill="#8B5CF6" opacity="0.78"/>
  </g>
</svg>
